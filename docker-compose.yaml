version: '3.9'

services:
  etcd:
    container_name: etcd
    image: quay.io/coreos/etcd:v3.5.5
    profiles: ["milvus"]
    ports:
      - "${ETCD_PORT}:2379"
    environment:
      - ETCD_AUTO_COMPACTION_RETENTION=1
    volumes:
      - ${MILVUS_DATA_PATH}/etcd:/etcd
    command:
      - etcd
      - -advertise-client-urls
      - http://127.0.0.1:2379
      - -listen-client-urls
      - http://0.0.0.0:2379
      - --data-dir
      - /etcd

  minio:
    container_name: minio
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    profiles: ["minio", "milvus"]
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    volumes:
      - ${MINIO_DATA_PATH}:/minio_data
    command:
      - minio
      - server
      - /minio_data
      - --console-address
      - ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  milvus:
    container_name: milvus
    image: milvusdb/milvus:v2.4.0
    profiles: ["milvus"]
    ports:
      - "${MILVUS_PORT}:19530"
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - ${MILVUS_DATA_PATH}/milvus:/var/lib/milvus
    command:
      - milvus
      - run
      - standalone
    depends_on:
      etcd:
        condition: service_started
      minio:
        condition: service_healthy

  # milvus-attu:
  #   container_name: milvus-attu
  #   image: milvusdb/attu:v2.4.0
  #   profiles: ["milvus"]
  #   ports:
  #     - "${MILVUS_WEBUI_PORT}:8000"
  #   environment:
  #     - MILVUS_URL=milvus:19530
  #   depends_on:
  #     milvus:
  #       condition: service_started

  weaviate:
    container_name: weaviate
    image: cr.weaviate.io/semitechnologies/weaviate:1.37.7
    profiles: ["weaviate"]
    ports:
      - "${WEAVIATE_PORT}:8080"
      - "${WEAVIATE_GRPC_PORT}:50051"
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: 'true'
      PERSISTENCE_DATA_PATH: '/var/lib/weaviate'
      DEFAULT_VECTORIZER_MODULE: 'none'
    volumes:
      - ${WEAVIATE_DATA_PATH}:/var/lib/weaviate

  redis:
    container_name: redis
    image: redis:7.2-alpine
    profiles: ["redis"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ${REDIS_DATA_PATH}:/data

  vllm:
    container_name: vllm
    image: vllm/vllm-openai:latest
    profiles: ["vllm"]
    ports:
      - "${VLLM_PORT}:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
    command:
      - --host
      - 0.0.0.0
      - --api-key
      - "${VLLM_API_KEY}"
      - --model
      - "${VLLM_MODEL}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL}"
      - --max-model-len
      - "${VLLM_MAX_LEN}"
      - --max-num-seqs
      - "${VLLM_MAX_SEQS}"
      - --kv-cache-dtype
      - "${VLLM_KV_DTYPE}"
      - --quantization
      - "${VLLM_QUANTIZATION}"
      - --dtype
      - "${VLLM_DTYPE}"
    shm_size: '4gb'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]